[workspace]
resolver = "2"
members = [
    "crates/oc-agent",
    "crates/oc-auth",
    "crates/oc-cli",
    "crates/oc-config",
    "crates/oc-global",
    "crates/oc-lsp",
    "crates/oc-mcp",
    "crates/oc-permission",
    "crates/oc-provider",
    "crates/oc-server",
    "crates/oc-session",
    "crates/oc-storage",
    "crates/oc-tool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# Stack bersama untuk semua sprint (aturan F di 02_WORKFLOW_AND_RULES.md).
# Crate baru tinggal pakai `dep.workspace = true`.
[workspace.dependencies]
anyhow = "1"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: objek JSON memakai IndexMap supaya urutan kunci terjaga,
# meniru semantik objek JS (penting untuk mergeDeep & golden test).
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.9"
tracing = "0.1"
whoami = "1"
