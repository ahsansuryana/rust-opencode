[package]
name = "oc-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "rust-opencode"
path = "src/main.rs"

[dependencies]
oc-global = { path = "../oc-global" }
oc-server = { path = "../oc-server" }
oc-session = { path = "../oc-session" }
oc-storage = { path = "../oc-storage" }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
serde_json = { workspace = true }
tokio = { workspace = true }
